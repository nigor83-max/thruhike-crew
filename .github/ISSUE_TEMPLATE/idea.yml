name: Idea or product feedback
description: Prepared template; repository Issues are currently disabled.
title: "[Idea]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Repository Issues are currently disabled. If enabled later, do not include personal, confidential, security-sensitive, or precise location information. Submitting an idea would not mean it is accepted or that a response is guaranteed.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to improve?
      description: Describe the user-facing problem without sharing private data.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a helpful outcome look like?
    validations:
      required: true
